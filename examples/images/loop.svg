<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="10" y="40" width="100" height="40" rx="6" fill="#dbe9f6" stroke="#333"/>
  <text x="60" y="65" text-anchor="middle">total = 0</text>
  <rect x="150" y="40" width="100" height="40" rx="6" fill="#dbe9f6" stroke="#333"/>
  <text x="200" y="65" text-anchor="middle">for k in ...</text>
  <rect x="290" y="40" width="100" height="40" rx="6" fill="#dbe9f6" stroke="#333"/>
  <text x="340" y="65" text-anchor="middle">total += k*k</text>
  <line x1="110" y1="60" x2="148" y2="60" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="250" y1="60" x2="288" y2="60" stroke="#333" marker-end="url(#arrow)"/>
  <path d="M340,40 C340,15 200,15 200,38" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <text x="270" y="14" text-anchor="middle" font-size="12">next k</text>
</svg>
